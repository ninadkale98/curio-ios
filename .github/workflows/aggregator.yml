name: Content aggregator

# Daily incremental pull across all channels (github, arxiv, rss, blog, hn),
# then a Pushover summary of what was queued. See pipeline/PIPELINE.md.
on:
  schedule:
    - cron: "0 14 * * *"   # 14:00 UTC daily (~7am PT)
  workflow_dispatch: {}     # allow manual runs from the Actions tab / gh CLI

concurrency:
  group: aggregator
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r pipeline/requirements.txt

      - name: Run aggregator (incremental, all channels)
        working-directory: pipeline
        env:
          SUPABASE_URL: https://mixkzotcnwvkdvlxhobe.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEMANTIC_SCHOLAR_KEY: ${{ secrets.SEMANTIC_SCHOLAR_KEY }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
        run: python -m aggregator.run
